[pytest]
pythonpath = .
testpaths = tests
addopts = -ra
markers =
    smoke: 快速真机冒烟用例，适合日常调试
    android_smoke: Android 本地模拟器冒烟用例
    full: 完整功能遍历用例，耗时更长
    rental: 租车下单与支付状态回归用例
    regression_bug: Taiga 关键/重要 bug 回归用例
    bug(ref): 关联的 Taiga bug 编号
    skip_home_session: 用例自行管理 App 首页会话恢复
    restore_home_after: 用例结束后强制恢复首页会话，适合会污染后续用例的场景
